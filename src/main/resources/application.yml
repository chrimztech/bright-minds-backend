spring:
  application:
    name: bright-minds-school-hub

  datasource:
    # Verified against the actual running Postgres instance (netstat shows it listening on
    # 5433, not 5432) — this value has been flip-flopped back to 5432 by several commits in
    # this repo's history, which breaks every DB-dependent feature (including role updates)
    # the moment the backend can't connect at all. If your Postgres really does move to a
    # different port, update this deliberately rather than guessing.
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/bright_minds_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:11111111}
    driver-class-name: org.postgresql.Driver

  jackson:
    # Several frontend forms (e.g. calendar audience: "all"/"staff"/...) send lowercase
    # values for fields backed by uppercase Java enums (EventAudience.ALL, etc.), which
    # Jackson otherwise rejects outright with a 400 "request body could not be read".
    # Accepting case-insensitively here fixes that class of bug everywhere in one place
    # instead of chasing down every enum-backed field one at a time.
    mapper:
      accept-case-insensitive-enums: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:no-reply@brightminds.school}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8081}
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24 hours
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@school.demo}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin123!}
    full-name: ${BOOTSTRAP_ADMIN_NAME:System Administrator}
  backup:
    pg-dump-path: ${PG_DUMP_PATH:pg_dump}
  uploads:
    dir: ${UPLOADS_DIR:./uploads}
    public-base-url: ${UPLOADS_PUBLIC_URL:/api/uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4173,http://localhost:8080}

logging:
  level:
    com.brightminds: DEBUG
    org.springframework.security: INFO
